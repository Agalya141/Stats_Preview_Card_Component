<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Stats Preview Card Component</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="card">
            <div class="card-header">
                <picture>
                    <source media = "(max-width:32.5rem)" srcset="image-header-mobile">
                    <img src="image-header-mobile.jpg" alt="image-header-mobile">
                </picture>
                <picture>
                    <source media = "(min-width:32.5rem)" srcset="image-product-desktop">
                    <img src="image-header-desktop.jpg" alt="image-header-desktop">
                </picture>
            </div>
            <div class="card-body">
                <h1 class="title">Get <span class="highlight">insights</span>that help your business grow.</h1>
                <p class="description">Discover the benefits of data analytics and make better decisions regarding revenue, customer experience, and overall efficiency</p>
                <section class="stats">
                    <div class="stat">
                        <h2 class="stat-number">100+</h2>
                        <p class="stat-label">COMPANIES</p>
                    </div>
                    <div class="stat">
                        <h2 class="stat-number">314</h2>
                        <p class="stat-label">TEMPLATES</p>
                    </div>
                    <div class="stat">
                        <h2 class="stat-number">12M+</h2>
                        <p class="stat-label">QUERIES</p>
                    </div>
                </section>
            </div>
        </div>
        <footer>
            <p class="attribution">
                Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
                Coded by <a href="#">Agalya</a>.
            </p>
        </footer>
    </body>
</html>
